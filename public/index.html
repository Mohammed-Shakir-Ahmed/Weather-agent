<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
	<title>Test Weather Agent</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #1d4ed8 0%, #0f172a 45%, #020617 100%);
    }

    main {
      width: min(760px, 100%);
      padding: 28px;
      border: 1px solid rgb(255 255 255 / 16%);
      border-radius: 24px;
      background: rgb(15 23 42 / 84%);
      box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
      backdrop-filter: blur(16px);
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgb(14 165 233 / 18%);
      color: #bae6fd;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .intro {
      color: #cbd5e1;
      margin: 0 0 18px;
      line-height: 1.6;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input,
    button {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      font: inherit;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 0 16px;
      background: rgb(248 250 252 / 96%);
      color: #0f172a;
    }

    button {
      padding: 0 20px;
      color: white;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      cursor: pointer;
      box-shadow: 0 10px 25px rgb(2 132 199 / 28%);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #status {
      min-height: 24px;
      margin: 18px 0;
      color: #bae6fd;
    }

    .summary-card,
    .current,
    .day,
    .advice-card {
      padding: 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgb(255 255 255 / 12%), rgb(255 255 255 / 6%));
      border: 1px solid rgb(255 255 255 / 10%);
    }

    .summary-card {
      margin-bottom: 16px;
      background: linear-gradient(135deg, rgb(2 132 199 / 24%), rgb(255 255 255 / 8%));
    }

    .summary-title {
      margin: 0 0 8px;
      color: #bae6fd;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .summary-text {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #f8fafc;
    }

    .current-grid,
    .forecast,
    .advice-grid {
      display: grid;
      gap: 12px;
    }

    .current-grid {
      grid-template-columns: repeat(2, 1fr);
      margin-top: 16px;
    }

    .forecast {
      grid-template-columns: repeat(3, 1fr);
      margin-top: 16px;
    }

    .advice-grid {
      grid-template-columns: repeat(3, 1fr);
      margin-top: 16px;
    }

    .card-label {
      display: block;
      color: #bae6fd;
      font-size: 0.82rem;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .location-name {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    .muted {
      color: #cbd5e1;
      margin: 0 0 8px;
      line-height: 1.6;
    }

    .error {
      color: #fecaca;
    }

    @media (max-width: 580px) {
      form {
        flex-direction: column;
      }

      .current-grid,
      .forecast,
      .advice-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="hero">
      <h1>Weather Agent</h1>
      <span class="pill">Daily guide</span>
    </div>
    <p class="intro">Enter a city to get a polished weather summary, smart daily advice, and a simple three-day outlook.</p>

    <form id="weather-form">
      <input
        id="city"
        name="city"
        value="New Delhi"
        placeholder="Enter a city"
        autocomplete="address-level2"
        required
      >
      <button id="submit-button" type="submit">Ask agent</button>
    </form>

    <p id="status" aria-live="polite"></p>
    <section id="result"></section>
  </main>

  <script>
    const form = document.querySelector("#weather-form");
    const cityInput = document.querySelector("#city");
    const button = document.querySelector("#submit-button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function formatDate(value) {
      return new Intl.DateTimeFormat("en", {
        weekday: "short",
        month: "short",
        day: "numeric"
      }).format(new Date(`${value}T12:00:00`));
    }

    function renderWeather(data) {
      const current = data.current;

      const adviceCards = (data.advice || []).map((item) => `
        <article class="advice-card">
          <strong>${escapeHtml(item.title)}</strong>
          <p>${escapeHtml(item.advice)}</p>
        </article>
      `).join("");

      const forecastCards = data.forecast.map((day) => `
        <article class="day">
          <strong>${escapeHtml(formatDate(day.date))}</strong>
          <p>${escapeHtml(day.condition)}</p>
          <p>
            ${escapeHtml(day.minimumTemperature)}°C -
            ${escapeHtml(day.maximumTemperature)}°C
          </p>
          <p>Rain: ${escapeHtml(day.precipitationChance)}%</p>
        </article>
      `).join("");

      result.innerHTML = `
        <article class="summary-card">
          <p class="summary-title">Today at a glance</p>
          <p class="summary-text">${escapeHtml(data.summary)}</p>
        </article>

        <article class="current">
          <h2 class="location-name">${escapeHtml(data.location.name)}</h2>
          <p class="muted">${escapeHtml(data.message)}</p>

          <div class="current-grid">
            <p>
              <span class="card-label">Temperature</span>
              <span class="value">
                ${escapeHtml(current.temperature)}°C
              </span>
            </p>

            <p>
              <span class="card-label">Feels like</span>
              <span class="value">
                ${escapeHtml(current.apparentTemperature)}°C
              </span>
            </p>

            <p>
              <span class="card-label">Humidity</span>
              <span class="value">
                ${escapeHtml(current.humidity)}%
              </span>
            </p>

            <p>
              <span class="card-label">Wind</span>
              <span class="value">
                ${escapeHtml(current.windSpeed)} km/h
              </span>
            </p>
          </div>
        </article>

        <div class="advice-grid">${adviceCards}</div>
        <div class="forecast">${forecastCards}</div>
      `;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const city = cityInput.value.trim();
      if (!city) return;

      status.className = "";
      status.textContent = "Checking the weather...";
      result.innerHTML = "";
      button.disabled = true;

      try {
        const response = await fetch(
          `/api/weather?city=${encodeURIComponent(city)}`
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Weather request failed.");
        }

        status.textContent = "";
        renderWeather(data);
      } catch (error) {
        status.className = "error";
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    form.requestSubmit();
  </script>
</body>
</html>
